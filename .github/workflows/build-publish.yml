name: Build and publish MessageHandler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify all platforms
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: |
          chmod +x ./gradlew
          ./gradlew test build --console=plain --no-daemon

  publish:
    name: Publish to SyntaxDevTeam Nexus
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    env:
      NEXUS_USER: ${{ secrets.NEXUS_USER }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish snapshot
        run: |
          set -euo pipefail
          if [ -z "${NEXUS_USER}" ] || [ -z "${NEXUS_PASSWORD}" ]; then
            echo "Missing NEXUS_USER or NEXUS_PASSWORD repository/organization secret." >&2
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew publish \
            -PnexusUser="${NEXUS_USER}" \
            -PnexusPassword="${NEXUS_PASSWORD}" \
            --console=plain --no-daemon
